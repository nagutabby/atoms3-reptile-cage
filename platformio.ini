; PlatformIO project config for M5Stack AtomS3
; Reptile smart-cage: two firmwares sharing src/common/ (switchbot_ble helper):
;   - m5stack-atoms3 (default): production automation (src/automation/main.cpp)
;   - inspection: standalone wiring/protocol check (src/inspection/main.cpp)
; Build/upload the inspection tool explicitly with `-e inspection`.
; ハードウェア非依存の判定ロジック(src/common/control_logic.cpp)だけは native 環境で
; 単体テストする。`pio test -e native` で実行(実機ビルドには影響しない)。
; native は espressif32向け設定(board等)を引き継げないため、共有設定は[env]ではなく
; [hw_common]に置き、ハードウェア環境側だけが${hw_common.xxx}で参照する。

[platformio]
default_envs = m5stack-atoms3

[hw_common]
platform = espressif32
board = m5stack-atoms3
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.3
    m5stack/M5Unified @ ^0.2.2
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=1

[env:m5stack-atoms3]
platform = ${hw_common.platform}
board = ${hw_common.board}
framework = ${hw_common.framework}
monitor_speed = ${hw_common.monitor_speed}
lib_deps = ${hw_common.lib_deps}
build_flags = ${hw_common.build_flags}
build_src_filter = +<common/> +<automation/>

[env:inspection]
platform = ${hw_common.platform}
board = ${hw_common.board}
framework = ${hw_common.framework}
monitor_speed = ${hw_common.monitor_speed}
lib_deps = ${hw_common.lib_deps}
build_flags = ${hw_common.build_flags}
build_src_filter = +<common/> +<inspection/>

[env:native]
platform = native
test_build_src = true
build_src_filter = +<common/control_logic.cpp>
